# ====================================
#            N E P T U N E
# ====================================

WandB:
    "entity"  : ["neptuneAI"]
    "project" : ["neptune-ae-training-debug"]
    "mode"    : ["online"]

Cluster:
  "account"       : ["bsmfc"]
  "partition"     : ["gpu"]
  "time"          : ["00:10:00"]
  "nodes"         : [2]
  "cpus-per-node" : [8]
  "gpus-per-node" : [1]
  "ram-per-node"  : ["60GB"]

Autoencoder:
  state:
    "checkpoint_name"    : [null]
    "checkpoint_version" : [null]
    "saving"             : [false]

  training:
    "steps_update"        : [64]
    "steps_logging"       : [2]
    "samples_validation"  : [4]
    "batch_size_per_step" : [8]
    "batch_size_per_gpu"  : [1]
    "learning_rate"       : [0.0001]
    "num_workers"         : [2]
    "prefetch_factor"     : [1]

  architecture:
    "checkpointing" : [False]
    "dropout"       : [0.05]
    "hid_blocks"    : [[1, 1, 1, 1]]
    "hid_channels"  : [[32, 64, 128, 256]]
    "lat_channels"  : [64]
    "kernel_size"   : [3]
    "stride"        : [2]
    "ffn_factor"    : [1]
