WandB:
    "entity"  : ["neptuneAI"]
    "project" : ["neptune-ae-debug"]
    "mode"    : ["disabled"]

Cluster:
  "account"       : ["bsmfc"]
  "partition"     : ["debug-gpu"]
  "time"          : ["00:10:00"]
  "nodes"         : [1]
  "cpus-per-node" : [8]
  "gpus-per-node" : [1]
  "ram-per-node"  : ["60GB"]

Autoencoder:
  state:
    "checkpoint_name" : [null]
    "saving"          : [false]

  architecture:
    "checkpointing" : [False]
    "dropout"       : [0.02]
    "hid_blocks"    : [[1, 1, 1]]
    "hid_channels"  : [[32, 64, 128]]
    "lat_channels"  : [32]
    "kernel_size"   : [3]
    "stride"        : [2]
    "ffn_factor"    : [1]

  training:
    "steps_update"        : [128]     # Model updates
    "steps_saving"        : [32]      # Updates between checkpoints
    "steps_logging"       : [4]       # Updates between logs
    "batch_size_per_gpu"  : [1]       # Samples per GPU
    "batch_size_per_step" : [2]       # Samples per update step
    "num_workers"         : [1]       # DataLoader workers
    "prefetch_factor"     : [1]       # Prefetched batches
    "learning_rate_start" : [0.0001]  # LR | Start
    "learning_rate_peak"  : [0.0005]  # LR | Peak (linear warmup)
    "learning_rate_end"   : [0.0001]  # LR | End (cosine decay)
    "warmup_steps"        : [16]      # LR | Steps for linear warmup
