WandB:
    "entity"  : ["neptuneAI"]
    "project" : ["neptune-ae-training"]
    "mode"    : ["online"]

Cluster:
  "account"       : ["bsmfc"]
  "partition"     : ["gpu"]
  "time"          : ["48:00:00"]
  "nodes"         : [8]
  "cpus-per-node" : [32]
  "gpus-per-node" : [4]
  "ram-per-node"  : ["240GB"]

Autoencoder:
  state:
    "checkpoint_name" : [null]
    "saving"          : [true]

  architecture:
    "checkpointing" : [true]
    "dropout"       : [0.0]
    "hid_blocks"    : [[3, 3, 3, 3, 3]]
    "hid_channels"  : [[512, 512, 768, 1024, 1024]]
    "lat_channels"  : [256]
    "kernel_size"   : [3]
    "stride"        : [2]
    "ffn_factor"    : [1]

  training:
    "steps_update"        : [125000]
    "steps_saving"        : [25]
    "steps_logging"       : [10]
    "batch_size_per_gpu"  : [4]
    "batch_size_per_step" : [128]
    "num_workers"         : [4]
    "prefetch_factor"     : [1]
    "learning_rate_start" : [0.00002]
    "learning_rate_peak"  : [0.00010]
    "learning_rate_end"   : [0.00001]
    "warmup_steps"        : [250]
