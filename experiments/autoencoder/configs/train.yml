# ====================================
#            N E P T U N E
# ====================================

WandB:
    "entity"  : ["neptuneAI"]
    "project" : ["neptune-ae-training"]
    "mode"    : ["online"]

Cluster:
  "account"       : ["bsmfc"]
  "partition"     : ["gpu"]
  "time"          : ["48:00:00"]
  "nodes"         : [8]
  "cpus-per-node" : [32]
  "gpus-per-node" : [4]
  "ram-per-node"  : ["240GB"]

Autoencoder:
  state:
    "checkpoint_name"    : [null]
    "saving"             : [true]

  architecture:
    "checkpointing" : [True]
    "dropout"       : [0.02]
    "hid_blocks"    : [[3, 3, 3, 3, 3]]
    "hid_channels"  : [[512, 640, 768, 896, 1024]]
    "lat_channels"  : [256]
    "kernel_size"   : [3]
    "stride"        : [2]
    "ffn_factor"    : [1]

  training:
    "steps_update"        : [128000]  # Model updates
    "steps_saving"        : [256]     # Updates between checkpoints
    "steps_logging"       : [32]      # Updates between logs
    "batch_size_per_gpu"  : [4]       # Samples per GPU
    "batch_size_per_step" : [256]     # Samples per update step
    "learning_rate"       : [0.0001]  # Optimizer learning rate
    "num_workers"         : [16]      # DataLoader workers
    "prefetch_factor"     : [1]       # Prefetched batches
