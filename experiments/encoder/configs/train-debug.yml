WandB:
    "entity"  : ["neptuneAI"]
    "project" : ["neptune-ae-debug"]
    "mode"    : ["online"]

Cluster:
  "account"       : ["bsmfc"]
  "partition"     : ["debug-gpu"]
  "time"          : ["00:10:00"]
  "nodes"         : [1]
  "cpus-per-node" : [8]
  "gpus-per-node" : [1]
  "ram-per-node"  : ["60GB"]

State:
    "saving"                  : [false]
    "checkpointing"           : [true]
    "checkpoint_name_surface" : [null]
    "checkpoint_name_ocean"   : [null]

Training:
    "batch_size_per_step_surface" : [4]
    "batch_size_per_step_ocean"   : [4]
    "batch_size_per_gpu_surface"  : [2]
    "batch_size_per_gpu_ocean"    : [2]
    "steps_update"                : [128]
    "steps_saving"                : [32]
    "steps_logging"               : [4]
    "num_workers"                 : [1]
    "prefetch_factor"             : [1]
    "learning_rate_start"         : [0.0005]
    "learning_rate_peak"          : [0.0010]
    "learning_rate_end"           : [0.0001]
    "warmup_steps"                : [32]

Encoders:

  Surface:
    "hid_channels"        : [[16, 32, 64]]
    "hid_blocks"          : [[3, 3, 3]]
    "hid_groups"          : [[2, 1, 1]]
    "lat_channels"        : [4]
    "kernel_size"         : [3]
    "stride"              : [2]
    "ffn_factor"          : [1]
    "dropout"             : [0.02]

  Ocean:
    "hid_channels"        : [[8, 16, 32]]
    "hid_blocks"          : [[3, 3, 3]]
    "hid_groups"          : [[2, 1, 1]]
    "lat_channels"        : [4]
    "kernel_size"         : [3]
    "stride"              : [2]
    "ffn_factor"          : [1]
    "dropout"             : [0.02]
