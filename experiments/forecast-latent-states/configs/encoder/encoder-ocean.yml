WandB:
    "entity"  : ["sail-nyu"]
    "project" : ["neptune-training-encoders"]
    "mode"    : ["online"]

Cluster:
    "account"       : ["bsmfc"]
    "partition"     : ["gpu"]
    "time"          : ["48:00:00"]
    "nodes"         : [4]
    "cpus-per-node" : [32]
    "gpus-per-node" : [4]
    "ram-per-node"  : ["240GB"]
    "restarts"      : [3]

State:
    "saving"           : [true]
    "checkpoint_name"  : [null]
    "resume_optimizer" : [true]

Training:
    "batch_size_per_step" : [128]
    "batch_size_per_gpu"  : [4]
    "samples_validation"  : [512]
    "steps_update"        : [16384]
    "steps_logging"       : [4]
    "steps_validation"    : [256]
    "steps_checkpoint"    : [256]
    "stopping_window"     : [10]
    "stopping_threshold"  : [0.01]
    "scale_distances"     : [false]
    "num_workers"         : [7]
    "prefetch_factor"     : [1]
    "warmup_steps"        : [1024]
    "learning_rate_start" : [0.00005]
    "learning_rate_peak"  : [0.00020]
    "learning_rate_end"   : [0.00001]

Model:
    "group"         : ["ocean"]
    "checkpointing" : [false]
    "dropout"       : [0.0]
    "kernel_size"   : [3]
    "periodic"      : [[]]
    "lat_channels"  : [128]
    "hid_channels"  : [[16, 64, 128, 256]]
    "hid_blocks"    : [[3, 3, 3, 3]]
    "stride"        : [[
        [2, 2, 2],
        [2, 2, 2],
        [2, 2, 2],
    ]]
