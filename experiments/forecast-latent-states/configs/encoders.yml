WandB:
    "entity"  : ["neptuneAI"]
    "project" : ["neptune-training-latent-encoder"]
    "mode"    : ["online"]

Cluster:
    "account"       : ["bsmfc"]
    "partition"     : ["gpu"]
    "time"          : ["48:00:00"]
    "nodes"         : [4]
    "cpus-per-node" : [32]
    "gpus-per-node" : [4]
    "ram-per-node"  : ["240GB"]

State:
    "saving"                  : [true]
    "checkpoint_name_surface" : [null]
    "checkpoint_name_ocean"   : [null]

Training:
    "batch_size_per_step_surface" : [1024]
    "batch_size_per_step_ocean"   : [1024]
    "batch_size_per_gpu_surface"  : [64]
    "batch_size_per_gpu_ocean"    : [8]
    "steps_update"                : [25600]
    "steps_logging"               : [16]
    "steps_validation"            : [512]
    "batches_validation"          : [16]
    "num_workers"                 : [4]
    "prefetch_factor"             : [1]
    "learning_rate_start"         : [0.0002]
    "learning_rate_peak"          : [0.0008]
    "learning_rate_end"           : [0.0001]
    "warmup_steps"                : [512]

Model:

    "lat_channels" : [1024]

    "config_surface":
        "hid_channels"  : [[16, 32, 64, 128, 256]]
        "hid_blocks"    : [[3, 3, 3, 3, 3]]
        "hid_groups"    : [[0, 0, 0, 0, 0]]
        "kernel_size"   : [3]
        "stride"        : [2]
        "ffn_factor"    : [1]
        "dropout"       : [0.02]
        "checkpointing" : [true]

    "config_ocean":
        "hid_channels"  : [[16, 32, 64, 128, 256]]
        "hid_blocks"    : [[3, 3, 3, 3, 3]]
        "hid_groups"    : [[0, 0, 0, 0, 0]]
        "kernel_size"   : [3]
        "stride"        : [2]
        "ffn_factor"    : [1]
        "dropout"       : [0.02]
        "checkpointing" : [true]
