WandB:
  "entity"  : ["neptuneAI"]
  "project" : ["neptune-diagnostics"]
  "mode"    : ["online"]

# Profiled on an A100 40GB with 64 members and chunks of 4 : 210 s, 27 GB of GPU and 19 GB of RAM per metrics window,
# 280 s, 26 GB of GPU and 22 GB of RAM per animated window
Cluster:
  "metrics":
    "account"   : ["bsmfc"]
    "partition" : ["gpu"]
    "time"      : ["00:30:00"]
    "cpus"      : [4]
    "gpus"      : [1]
    "ram"       : ["32GB"]

  "forecasts":
    "account"   : ["bsmfc"]
    "partition" : ["debug-gpu"]
    "time"      : ["01:45:00"]
    "cpus"      : [4]
    "gpus"      : [1]
    "ram"       : ["48GB"]

  "figures":
    "account"   : ["bsmfc"]
    "partition" : ["batch"]
    "time"      : ["01:00:00"]
    "cpus"      : [1]
    "ram"       : ["16GB"]

  "cleanup":
    "account"   : ["bsmfc"]
    "partition" : ["batch"]
    "time"      : ["00:15:00"]
    "cpus"      : [1]
    "ram"       : ["2GB"]

Model:
  "checkpoint_name" : ["FGN_in2_lc256_cf121_tk2304_hc1024_hb16__4827"]

