WandB:
    "entity"  : ["neptuneAI"]
    "project" : ["neptune-3D-encoder-training"]
    "mode"    : ["online"]

Cluster:
  "account"       : ["bsmfc"]
  "partition"     : ["gpu"]
  "time"          : ["48:00:00"]
  "nodes"         : [8]
  "cpus-per-node" : [32]
  "gpus-per-node" : [4]
  "ram-per-node"  : ["240GB"]

State:
    "saving"                  : [true]
    "checkpointing"           : [true]
    "checkpoint_name_surface" : [null]
    "checkpoint_name_ocean"   : [null]

Training:
    "batch_size_per_step_surface" : [512]
    "batch_size_per_step_ocean"   : [512]
    "batch_size_per_gpu_surface"  : [8]
    "batch_size_per_gpu_ocean"    : [4]
    "steps_update"                : [128000]
    "steps_saving"                : [32]
    "steps_logging"               : [8]
    "num_workers"                 : [1]
    "prefetch_factor"             : [1]
    "learning_rate_start"         : [0.0001]
    "learning_rate_peak"          : [0.0005]
    "learning_rate_end"           : [0.0001]
    "warmup_steps"                : [512]

Encoders:

  Surface:
    "hid_channels"        : [[32, 64, 128, 256]]
    "hid_blocks"          : [[3, 3, 3, 3]]
    "hid_groups"          : [[2, 2, 1, 1]]
    "lat_channels"        : [128]
    "kernel_size"         : [3]
    "stride"              : [2]
    "ffn_factor"          : [1]
    "dropout"             : [0.02]

  Ocean:
    "hid_channels"        : [[16, 32, 64, 128]]
    "hid_blocks"          : [[3, 3, 3, 3]]
    "hid_groups"          : [[2, 2, 1, 1]]
    "lat_channels"        : [128]
    "kernel_size"         : [3]
    "stride"              : [2]
    "ffn_factor"          : [1]
    "dropout"             : [0.02]
