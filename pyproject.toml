[project]
name = "neptune"
version = "1.0.0"
description = "A generative emulator of the Black Sea Forecast Operational Model."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
  "albus @ git+https://github.com/VikVador/albus.git",
  "azula @ git+https://github.com/probabilists/azula@dev",
  "cloudpickle==3.1.2",
  "dask==2024.6.2",
  "dawgz==1.0.4",
  "netCDF4==1.7.0",
  "numpy==1.26.3",
  "omegaconf==2.3.0",
  "pyyaml==6.0.2",
  "shaggy @ git+https://github.com/VikVador/shaggy.git",
  "torch==2.5.1",
  "tqdm==4.66.4",
  "wandb==0.26.1",
  "xarray==2025.9.0",
  "zarr==3.1.2",
]

[project.optional-dependencies]
all = [
  "ipykernel==6.29.5",
  "jupyterlab==4.2.2",
  "matplotlib==3.9.0",
  "pre-commit==3.7.1",
  "pytest==8.2.2",
  "ruff==0.4.8",
  "torchvision>=0.20",
]

[tool.ruff]
line-length = 99
exclude = ["notebooks/"]

[tool.ruff.lint]
extend-select = ["ANN", "B", "I", "UP", "W"]
ignore = ["ANN002", "ANN003", "ANN401", "E731", "E741"]
preview = true

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
lines-between-types = 1
relative-imports-order = "closest-to-furthest"
section-order = ["future", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "neptune.__version__"}

[tool.setuptools.packages.find]
include = ["neptune*"]
